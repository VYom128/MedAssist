# CI (spec §18): install → lint → format check → typecheck → tests → build, on every push and PR.
# Tests use the in-memory MongoDB replica set and the mock AI provider (forced in test config);
# no secrets are needed and nothing calls Groq.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Build server and client
        run: npm run build
        env:
          # The production client build needs the API and socket addresses; any values do here.
          VITE_API_URL: /api/v1
          VITE_SOCKET_URL: https://api.example.invalid

  server-tests:
    name: Server tests (coverage ≥ 80 % on services and policies)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # mongodb-memory-server downloads mongod (~100 MB) on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - run: npm run test:coverage -w server
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 7

  client-tests:
    name: Client tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -w client

  # The §15.2 happy path in a real browser (Playwright, Chromium only), on main only so PRs stay
  # fast: it builds its own stack (in-memory MongoDB, fresh seed, mock AI) and takes a few minutes.
  e2e:
    name: End-to-end happy path
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, server-tests, client-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      # Browsers are cached per Playwright version; system libraries are installed every run.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload the trace and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
